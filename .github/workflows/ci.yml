# CI/CD for Golden Path Demo Service.
# The pipeline itself lives in the golden path repo and is versioned (v1):
# fixes and new gates reach every service by moving that tag, not by editing 30 copies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      enable-cache:
        description: Use dependency, Docker layer and scanner caches
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    uses: RidhanPar/devex-golden-path/.github/workflows/reusable-python-ci.yml@v1
    with:
      python-version: "3.13"
      enable-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.enable-cache }}

  security:
    uses: RidhanPar/devex-golden-path/.github/workflows/reusable-security.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      enable-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.enable-cache }}

  container:
    uses: RidhanPar/devex-golden-path/.github/workflows/reusable-docker.yml@v1
    with:
      enable-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.enable-cache }}

  # The single required status check for branch protection. Required checks are matched by
  # name, so depending on one stable aggregate job means the pipeline can gain or rename
  # jobs without anyone editing branch protection on every repository.
  all-green:
    name: CI passed
    if: always()
    needs: [quality, security, container]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate succeeded (skipped is OK, e.g. dependency-review on push)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")'

  deploy:
    needs: [all-green]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: RidhanPar/devex-golden-path/.github/workflows/reusable-deploy.yml@v1
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # request the OIDC token
    with:
      environment: production
